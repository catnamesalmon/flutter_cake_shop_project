name: flutter_cake_shop_project
description: "Cake shop directory for Assignment 06."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: 8.2.1
  font_awesome_flutter: ^11.0.0
  carousel_slider: ^5.1.2
  flutter_map: ^8.3.2
  url_launcher: ^6.3.3
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/icon.png
  remove_alpha_ios: true